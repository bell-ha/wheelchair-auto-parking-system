<text x="720" y="476" font-size="12" fill="#8a8a8a" font-weight="400">전방 초음파</text>
<text x="690" y="532" font-size="12.5" fill="#444" font-weight="600">4단계가 90°가 아니라 70°인 이유 —</text>
<text x="690" y="550" font-size="12.5" fill="#666" font-weight="400">90°로 돌면 차량 후면 특징점이 시야에서</text>
<text x="690" y="568" font-size="12.5" fill="#666" font-weight="400">사라진다. 대각선으로 이동해 유지한다.</text>
