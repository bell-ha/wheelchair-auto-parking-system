<text x="60" y="622" font-size="13.5" fill="#333" font-weight="400">휠체어는 좌우로 이동할 수 없다. <tspan font-weight="600">직·후진과 회전만으로</tspan> 목표 자세에 도달해야 한다.</text>
<text x="303" y="650" font-size="14" fill="#1a1a1a" font-weight="400">Fig. 3   9단계 주차 시나리오 — 출차는 이 순서를 뒤집은 7단계다</text>
